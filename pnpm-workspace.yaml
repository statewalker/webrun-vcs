# Security fixes for transitive dependencies whose parents pin a vulnerable version.
# Remove an entry once its parent ships a release with the fixed version.
overrides:
  # @observablehq/framework requires esbuild ^0.27.3
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
  # @changesets/cli
  "launch-editor@<2.14.2": ^2.14.2
  # @observablehq/framework
  "markdown-it@>=14.1.0 <14.3.3": ^14.3.3
  # workbox-build (@rollup/plugin-terser, ajv) and @observablehq/framework
  "serialize-javascript@<7.1.3": ^7.1.3
  "fast-uri@>=3.0.0 <3.1.9": ^3.1.9
  "glob@>=9.0.0 <14.0.2": ^14.0.2
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1
