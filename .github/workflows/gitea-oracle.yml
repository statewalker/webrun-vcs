name: Gitea oracle

# Our smart HTTP (vcs-transport) and Git LFS (vcs-transport-lfs) clients against a real Gitea:
# packages/vcs-testing-gitea downloads the pinned release (checked against its SHA-256) and runs
# it headless. Weekly, by hand, and on pull requests that touch the transports or the oracle.
# The binary (~143 MB) is cached by version: bump the key with GITEA_VERSION in
# packages/vcs-testing-gitea/src/release.ts.
on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/vcs-transport/src/**"
      - "packages/vcs-transport-lfs/src/**"
      - "packages/vcs-testing-gitea/**"
      - ".github/workflows/gitea-oracle.yml"

permissions:
  contents: read

concurrency:
  group: gitea-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  GITEA_VERSION: "1.22.6"
  GITEA_CACHE_DIR: ${{ github.workspace }}/../gitea-cache

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/cache@v6
        with:
          path: ${{ env.GITEA_CACHE_DIR }}
          key: gitea-${{ env.GITEA_VERSION }}-linux-amd64

      - name: Native git and git-lfs
        run: |
          git --version
          git lfs version

      # Only the oracle and the packages it depends on.
      - name: Install
        run: pnpm install --frozen-lockfile --filter @statewalker/vcs-testing-gitea...

      - name: Build
        run: pnpm --filter "@statewalker/vcs-testing-gitea^..." run build

      - name: Typecheck
        run: pnpm --filter @statewalker/vcs-testing-gitea run typecheck

      - name: Oracle tests
        run: pnpm --filter @statewalker/vcs-testing-gitea run test:oracle
