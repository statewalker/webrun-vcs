# gitleaks configuration for the secret scan in CI (statewalker/statewalker-ci, `secret-scan`).
# The default rules apply; the allowlist below only removes false positives.

[extend]
useDefault = true

# A Git implementation's code, tests and fixtures are full of object ids: 40 (SHA-1) or 64
# (SHA-256) lowercase hex digits, such as `const key = "b45ef6fe…"` in vcs-testing's raw-store
# suite, which `generic-api-key` reports for their entropy. An object id is a content hash, not a
# credential. Real tokens of that shape are caught by their own rules (they carry a prefix).
[[allowlists]]
description = "Git object ids (SHA-1 and SHA-256 hex)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^[0-9a-f]{40}$''', '''^[0-9a-f]{64}$''']
